name: Deploy API Worker

on:
  push:
    paths:
      - 'workers/api/**'

jobs:
  deploy-api:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install deps (Bun)
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.jsonc --keep-vars

      - name: Post-deploy summary
        if: success()
        run: |
          echo "::notice title=Deployment::API worker deploy succeeded on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          {
            echo "## ✅ API Worker Deployment Succeeded"
            echo ""
            echo "- Repo: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Worker: custos-api"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
