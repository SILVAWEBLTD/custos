name: Deploy Production (OpenNext on Workers)

on:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install deps
        run: npm ci

      - name: Install OpenNext + Wrangler
        run: npm i -D @opennextjs/cloudflare wrangler

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.jsonc -e production

      - name: Post-deploy summary
        if: success()
        run: |
          echo "::notice title=Deployment::Production deploy succeeded on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          {
            echo "## ✅ Production Deployment Succeeded"
            echo ""
            echo "- Repo: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Worker: cloudflare-fullstack-frontend"
            echo ""
            echo "### 🔗 Links"
            echo "- <a href=\"https://silvaweb.org\" target=\"_blank\" rel=\"noopener noreferrer\">Open Production</a>"
            echo "- <a href=\"https://cloudflare-fullstack-frontend.maxsilvauk.workers.dev\" target=\"_blank\" rel=\"noopener noreferrer\">Workers.dev (prod)</a>"
          } >> "${GITHUB_STEP_SUMMARY}"
