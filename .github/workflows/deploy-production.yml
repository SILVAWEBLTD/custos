name: Deploy Production (OpenNext on Workers)

on:
  push:
    branches: [production]

jobs:
  build-and-deploy:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install deps (Bun)
        run: bun install --frozen-lockfile

      - name: Install OpenNext + Wrangler
        run: bun i -D @opennextjs/cloudflare wrangler

      - name: Build (OpenNext)
        run: NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }} bunx opennextjs-cloudflare build

      - name: Sync secrets to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_METRICS_API_KEY: ${{ secrets.TOKEN_METRICS_API_KEY }}
        run: |
          if [ -z "$TOKEN_METRICS_API_KEY" ]; then
            echo "TOKEN_METRICS_API_KEY secret is not set" >&2
            exit 1
          fi
          bunx wrangler secret put TOKEN_METRICS_API_KEY -c wrangler.jsonc -e production --text "$TOKEN_METRICS_API_KEY"

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.jsonc -e production --keep-vars

      - name: Post-deploy summary
        if: success()
        run: |
          echo "::notice title=Deployment::Production deploy succeeded on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          {
            echo "## ✅ Production Deployment Succeeded"
            echo ""
            echo "- Repo: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Worker: custos-frontend"
            echo ""
            echo "### 🔗 Links"
            echo "- <a href=\"https://custos.space\" target=\"_blank\" rel=\"noopener noreferrer\">https://custos.space</a>"
          } >> "${GITHUB_STEP_SUMMARY}"
