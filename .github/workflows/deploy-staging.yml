name: Deploy Staging (OpenNext on Workers)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install deps (Bun)
        run: bun install --frozen-lockfile

      - name: Install OpenNext + Wrangler
        run: npm i -D @opennextjs/cloudflare wrangler

      - name: Build (OpenNext)
        run: bunx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.jsonc -e staging

      - name: Post-deploy summary
        if: success()
        run: |
          echo "::notice title=Deployment::Staging deploy succeeded on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          {
            echo "## ✅ Staging Deployment Succeeded"
            echo ""
            echo "- Repo: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Worker: cloudflare-fullstack-frontend-staging"
          } >> "${GITHUB_STEP_SUMMARY}"
