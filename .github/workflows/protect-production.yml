name: Protect Production Merge

on:
  pull_request:
    branches: [production]

jobs:
  enforce-source-branch:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Allow only staging -> production
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "Only merges from 'staging' into 'production' are allowed."
            exit 1
          fi
          echo "Allowed: staging -> production."